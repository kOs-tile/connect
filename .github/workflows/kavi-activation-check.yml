# Temporary, non-deploying workflow to verify fork Actions registration.
# No secrets, no write permissions and no deployment actions.
name: KAVI Actions registration check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Actions are enabled on the fork
        run: |
          echo "Actions workflow discovered and started"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
